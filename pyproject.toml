[project]
name = "minsky"
version = "0.1.0"
description = "A local RAG layer over your own code projects, exposed as an MCP server"
requires-python = ">=3.11"
dependencies = [
    "lancedb>=0.13",
    "pylance>=11.0.0",
    "pyarrow>=14",
    "httpx>=0.27",
    "pathspec>=0.12",
    "mcp>=1.2.0",
    "tree-sitter-language-pack>=1.19.0",
]

[project.scripts]
minsky = "minsky.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["minsky*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long lines here are an embedded HTML/CSS/JS template, not Python logic.
"deploy/modal_app.py" = ["E501"]

